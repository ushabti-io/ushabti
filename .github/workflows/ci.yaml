name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every stable Python from the oldest supported to the newest.
        # Add the next one here when it is released.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One source of truth for the uv version: the image tag in the
      # Dockerfiles, which Dependabot keeps current.
      - name: Read the uv version the images use
        id: uv
        run: |
          version="$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9][0-9.]*\) AS uv$|\1|p' deploy/docker/agent.Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error::could not read the uv version from deploy/docker/agent.Dockerfile"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy packages scripts

      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Check that the SDK imports with no extras installed
        run: >-
          uv run --isolated --no-dev --package ushabti
          python -c "import ushabti, ushabti.models.anthropic, ushabti.models.openai_compatible"

  secrets:
    name: Secrets and private details
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so that a secret added and then removed is still found.
          fetch-depth: 0

      # The same gitleaks version as the hook in .pre-commit-config.yaml, with
      # the rules in .gitleaks.toml. The image is pinned by digest.
      - name: Scan every commit with gitleaks
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/repo"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner .

  deployment-files:
    name: Helm chart and Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint the chart in every mode
        run: |
          helm lint deploy/helm/ushabti
          helm lint deploy/helm/ushabti --values deploy/helm/ushabti/ci/independent-values.yaml
          helm lint deploy/helm/ushabti --values deploy/helm/ushabti/ci/overseen-values.yaml
          helm lint deploy/helm/ushabti --values deploy/helm/ushabti/ci/allow-write-values.yaml

      - name: Render the chart in every mode
        run: |
          helm template ushabti deploy/helm/ushabti > /dev/null
          helm template ushabti deploy/helm/ushabti \
            --values deploy/helm/ushabti/ci/independent-values.yaml > /dev/null
          helm template ushabti deploy/helm/ushabti \
            --values deploy/helm/ushabti/ci/overseen-values.yaml > /dev/null
          helm template ushabti deploy/helm/ushabti \
            --values deploy/helm/ushabti/ci/allow-write-values.yaml > /dev/null

      # The workflows read the uv version from one Dockerfile, so the two
      # must not drift apart.
      - name: Check that both Dockerfiles use the same base images
        run: >-
          diff
          <(grep '^FROM' deploy/docker/agent.Dockerfile)
          <(grep '^FROM' deploy/docker/overseer.Dockerfile)

      - name: Validate the Compose files
        env:
          # overseen.yaml refuses to render without a token. This is not a secret.
          USHABTI_ADMIN_TOKEN: placeholder-for-validation
        run: |
          docker compose --file deploy/compose/solo.yaml config --quiet
          docker compose --file deploy/compose/overseen.yaml config --quiet

  images:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [agent, overseer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built and never pushed. Publishing happens only in release.yaml.
      - name: Build
        run: >-
          docker build
          --file deploy/docker/${{ matrix.image }}.Dockerfile
          --tag ushabti-${{ matrix.image }}:ci
          .

      - name: Check that the image starts
        run: docker run --rm ushabti-${{ matrix.image }}:ci version

  all-checks:
    # The one status the ruleset on main requires. It fails when any job above
    # failed, was cancelled, or was skipped, so jobs can be added or renamed
    # without touching the ruleset.
    name: All checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, secrets, deployment-files, images]
    if: always()
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a job did not succeed (${result})"
              exit 1
            fi
          done
