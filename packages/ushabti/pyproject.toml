[project]
name = "ushabti"
version = "0.1.0.dev2"
description = "SDK for Ushabti, an open-source DevOps agent harness: spells, implements, weighing, and papyrus."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["devops", "sre", "agents", "monitoring", "kubernetes", "proxmox", "shabti", "shawabti"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[project.urls]
Repository = "https://github.com/ushabti-io/ushabti"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.6.0",
]
openai = [
    "openai>=3.46.0",
]
kubernetes = [
    "kubernetes>=37.0.2",
]
proxmox = [
    "proxmoxer>=2.3.0",
]
prometheus = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
