{{- if .Values.agent.rbac.create }}
{{- $name := printf "%s-%s" (include "ushabti.fullname" .) .Release.Namespace }}
# What an ushabti may read in the cluster. This role is always read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "ushabti.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "nodes", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "ushabti.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ushabti.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.agent.rbac.allowWrite }}
{{- range .Values.agent.rbac.writeNamespaces }}
---
# Opt-in write verbs, granted in this namespace only: enough to restart a
# deployment (patch) and to scale one (patch or update its scale).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-write
  namespace: {{ . }}
  labels:
    {{- include "ushabti.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-write
  namespace: {{ . }}
  labels:
    {{- include "ushabti.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-write
subjects:
  - kind: ServiceAccount
    name: {{ include "ushabti.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
