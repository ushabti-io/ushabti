{{- if .Values.agent.rbac.create }}
# What an ushabti may do in the cluster. Read-only unless
# agent.rbac.allowWrite is true.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ushabti.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "ushabti.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "nodes", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.agent.rbac.allowWrite }}
  # Opt-in write verbs: enough to restart and to scale a deployment.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["patch", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ushabti.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "ushabti.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ushabti.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ushabti.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
