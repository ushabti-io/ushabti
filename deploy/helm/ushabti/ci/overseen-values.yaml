# Test values: overseen mode, two ushabti and an overseer.
# The Secret names are references. The Secrets themselves are made by hand.
mode: overseen
adminToken:
  existingSecret: ushabti-admin
ushabti:
  - name: k3s-watcher-a
    spell: k3s-watcher
  - name: k3s-watcher-b
    spell: k3s-watcher
agent:
  env:
    - name: USHABTI_MODEL
      value: test-model
  secretEnv:
    - name: ANTHROPIC_API_KEY
      secretName: ushabti-model
      secretKey: anthropic-api-key
