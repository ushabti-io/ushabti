[project]
name = "ushabti-agent"
version = "0.1.0.dev2"
description = "Agent runtime for Ushabti: one ushabti running one spell, with its vigil loop, CLI, and HTTP API."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["devops", "sre", "agents", "monitoring", "kubernetes", "proxmox", "shabti", "shawabti"]
classifiers = [
    # Not published to PyPI: this ships as a container image. PyPI refuses any
    # upload that carries this classifier.
    "Private :: Do Not Upload",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "typer>=0.28.0",
    "ushabti>=0.1.0.dev2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Pass-through extras, so one install line picks the model SDKs an agent needs.
anthropic = ["ushabti[anthropic]"]
openai = ["ushabti[openai]"]
kubernetes = ["ushabti[kubernetes]"]
proxmox = ["ushabti[proxmox]"]
prometheus = ["ushabti[prometheus]"]

[project.scripts]
ushabti = "ushabti_agent.cli:app"

[project.urls]
Repository = "https://github.com/ushabti-io/ushabti"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
ushabti = { workspace = true }
